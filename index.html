<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat-container {
            width: 420px;
            height: 620px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; border-bottom: 1px solid #eee; }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .user { background-color: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .bot { background-color: #e9ecef; color: #333; align-self: flex-start; }
        #input-area { display: flex; padding: 10px; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        #send-btn {
            padding: 10px 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-box">
            <div class="message bot" id="status-msg">Connecting to dictionary.txt...</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a message..." disabled>
            <button id="send-btn" disabled>Send</button>
        </div>
    </div>

    <script>
        let dictionary = [];
        let wordSet = new Set();

        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-box');
        const statusMsg = document.getElementById('status-msg');

        async function loadDictionary() {
            try {
                const response = await fetch('dictionary.txt');
                if (!response.ok) throw new Error("File not found");
                
                const text = await response.text();
                
                dictionary = text.split(/\s+/).map(w => w.trim().toLowerCase())
                                   .filter(w => w.length > 2);
                
                wordSet = new Set(dictionary);
                
                statusMsg.textContent = `Connected! Loaded ${dictionary.length} words from dictionary.txt`;
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (error) {
                statusMsg.textContent = "Error loading dictionary.txt";
                console.error(error);
            }
        }

        function getRandomWord() {
            return dictionary[Math.floor(Math.random() * dictionary.length)];
        }

        function getBotResponse(userMessage) {
            if (dictionary.length === 0) return "dictionary empty";

            const msg = userMessage.toLowerCase().trim();
            let words = [];

            // Echo some words from user if they exist in dictionary
            const userWords = msg.match(/\b\w+\b/g) || [];
            userWords.forEach(w => {
                if (wordSet.has(w)) words.push(w);
            });

            // Basic sentence patterns using only your dictionary words
            const patterns = [
                [getRandomWord(), getRandomWord(), "the", getRandomWord(), getRandomWord(), getRandomWord()],
                ["i", getRandomWord(), getRandomWord(), "you", getRandomWord(), getRandomWord()],
                ["the", getRandomWord(), getRandomWord(), "is", getRandomWord(), getRandomWord()],
                [getRandomWord(), getRandomWord(), "and", getRandomWord(), getRandomWord(), "now"],
                ["you", getRandomWord(), getRandomWord(), "this", getRandomWord(), getRandomWord()]
            ];

            let base = patterns[Math.floor(Math.random() * patterns.length)];

            // Add some user words at the beginning if available
            if (words.length > 0) {
                base.unshift(...words.slice(0, 2));
            }

            // Fill any missing slots with random words
            while (base.length < 7) {
                base.push(getRandomWord());
            }

            let reply = base.join(" ");
            reply = reply.charAt(0).toUpperCase() + reply.slice(1);
            reply += [".", "!", "?"][Math.floor(Math.random() * 3)];

            return reply;
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender.toLowerCase());
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('User', text);
            userInput.value = '';

            setTimeout(() => {
                const botReply = getBotResponse(text);
                appendMessage('Bot', botReply);
            }, 350);
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        loadDictionary();
    </script>
</body>
</html>
